<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadro de Tarefas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Região viva: presente e vazia desde o início do documento, para que
       leitores de tela já a conheçam antes de qualquer mudança de estado. -->
  <div id="regiao-status" role="status" aria-live="polite" class="sr-only"></div>

  <header>
    <h1>Quadro de Tarefas</h1>
  </header>

  <main>

    <section class="secao-busca" aria-labelledby="titulo-busca-filtros">
      <h2 id="titulo-busca-filtros">Busca e filtros</h2>

      <form>
        <div>
          <label for="busca-titulo">Buscar por título da tarefa</label>
          <input type="search" id="busca-titulo" name="busca-titulo">
        </div>

        <fieldset>
          <legend>Filtrar por status</legend>

          <input type="radio" id="status-todos" name="filtro-status" value="todos" checked>
          <label for="status-todos">Todos</label>

          <input type="radio" id="status-a-fazer" name="filtro-status" value="a-fazer">
          <label for="status-a-fazer">A fazer</label>

          <input type="radio" id="status-em-andamento" name="filtro-status" value="em-andamento">
          <label for="status-em-andamento">Em andamento</label>

          <input type="radio" id="status-em-revisao" name="filtro-status" value="em-revisao">
          <label for="status-em-revisao">Em revisão</label>

          <input type="radio" id="status-concluida" name="filtro-status" value="concluida">
          <label for="status-concluida">Concluída</label>
        </fieldset>

        <fieldset>
          <legend>Filtrar por prioridade</legend>

          <input type="radio" id="prioridade-todas" name="filtro-prioridade" value="todas" checked>
          <label for="prioridade-todas">Todas</label>

          <input type="radio" id="prioridade-baixa" name="filtro-prioridade" value="baixa">
          <label for="prioridade-baixa">Baixa</label>

          <input type="radio" id="prioridade-media" name="filtro-prioridade" value="media">
          <label for="prioridade-media">Média</label>

          <input type="radio" id="prioridade-alta" name="filtro-prioridade" value="alta">
          <label for="prioridade-alta">Alta</label>
        </fieldset>
      </form>
    </section>

    <!-- Mensagem visível dos estados de carregando / vazio / erro.
         Começa oculta: só aparece quando um desses três estados é aplicado. -->
    <p id="mensagem-estado" class="mensagem-estado" hidden></p>

    <!-- Quadro de colunas: começa vazio, js/renderizacao.js preenche as
         listas quando o estado de sucesso é aplicado. -->
    <div id="quadro-status">

      <section class="coluna-status coluna-status--a-fazer" aria-labelledby="titulo-a-fazer">
        <h2 id="titulo-a-fazer">A fazer</h2>
        <ul class="lista-tarefas"></ul>
      </section>

      <section class="coluna-status coluna-status--em-andamento" aria-labelledby="titulo-em-andamento">
        <h2 id="titulo-em-andamento">Em andamento</h2>
        <ul class="lista-tarefas"></ul>
      </section>

      <section class="coluna-status coluna-status--em-revisao" aria-labelledby="titulo-em-revisao">
        <h2 id="titulo-em-revisao">Em revisão</h2>
        <ul class="lista-tarefas"></ul>
      </section>

      <section class="coluna-status coluna-status--concluida" aria-labelledby="titulo-concluida">
        <h2 id="titulo-concluida">Concluída</h2>
        <ul class="lista-tarefas"></ul>
      </section>

    </div>

  </main>

  <footer>
    <p>Ricardo Augusto Lopes Barbosa — Desenvolvimento Frontend, 2026.2</p>
  </footer>

  <script type="module" src="js/main.js"></script>

</body>
</html>
